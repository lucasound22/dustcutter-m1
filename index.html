    else if (cmd === 0xB0) {
      var x = v / 127;
      if (n === 1) { eng.setFx({ morph: x }, true); syncPerf(); }
      else if (n === 74) { eng.setFx({ filter: x * 2 - 1 }, true); syncPerf(); }
      else if (n === 71) { eng.setFx({ res: x }, true); syncPerf(); }
      else if (n === 7) { eng.setFx({ master: x }); syncTransport(); }
    } else if (cmd === 0xC0) chooseLoop(n & 15);
  }
  function enableMidi(statusEl) {
    if (!navigator.requestMIDIAccess) { statusEl.textContent = 'MIDI input is not available in this browser (iOS Safari does not support Web MIDI). Chrome, Edge and Android do.'; return; }
    navigator.requestMIDIAccess().then(function (acc) {
      midiAcc = acc;
      function bind() {
        var names = []; acc.inputs.forEach(function (i) { i.onmidimessage = onMidiMsg; names.push(i.name); });
        statusEl.textContent = names.length ? 'Listening: ' + names.join(', ') : 'No MIDI inputs found — plug in a controller.';
      }
      bind(); acc.onstatechange = bind;
    }).catch(function () { statusEl.textContent = 'MIDI access was blocked.'; });
  }

  function wireGlobal() {
    wirePads();
    document.addEventListener('pointerdown', function () { if (ui.started && eng.ctx && eng.ctx.state !== 'running') eng.unlock(); }, true);
    eng.onTrigger = function (id, start, vel, fromSeq) {
      var delay = Math.max(0, (start - eng.ctx.currentTime) * 1000);
      if (delay < 4) flashPad(id, vel); else setTimeout(function () { flashPad(id, vel); }, delay);
    };
    eng.onPattern = function (idx) {
      if (ui.lastPat === idx) { refreshLoopChips(); return; }
      ui.lastPat = idx; ui.bank = eng.pattern.bank; ui.page = 0; ui.insp = null; ui.lane = 0; ui.layerView = false;
      renderKits(); renderPads(); syncTransport();
      if (ui.tab === 'seq' || ui.tab === 'perf') renderPanel(); else refreshLoopChips();
    };
    eng.onMotion = function () { syncPerf(); };
    eng.onSong = function (pos) { ui.songPos = pos; var box = $('.songbox'); if (ui.tab === 'seq' && box) renderSong(box); };
    eng.onRecord = function (r) { if (!r) toast('That pad is not in the pattern’s kit — set KIT or LAYER in the sequencer'); else if (refs.seqCols && ui.tab === 'seq') { var base = ui.layerView ? 16 : 0, row = r.lane - base; if (row >= 0 && row < 16) { var cell = refs.seqCols[r.step][row]; if (cell) setCell(cell, eng.pattern.steps[r.lane][r.step]); } } markDirty(); };
    eng.onState = function (s) {
      if (s === 'transport') { syncTransport(); return; }
      refs.resume.hidden = !(ui.started && s !== 'running');
    };

    document.addEventListener('keydown', function (e) {
      if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || !ui.started) return;
      var t = e.target; if (t && (t.tagName === 'INPUT' && t.type !== 'range' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
      var k = e.key, idx = KEYMAP.indexOf(k.toLowerCase());
      if (e.code === 'Space') { e.preventDefault(); transportToggle(); }
      else if (e.shiftKey && k.toLowerCase() === 'r') { toggleRec(); }
      else if (k === 'Escape') { eng.player.silence(); eng.repeaters.clear(); }
      else if (k === 'ArrowLeft') { setBank((ui.bank + 7) % 8); }
      else if (k === 'ArrowRight') { setBank((ui.bank + 1) % 8); }
      else if (k === 'ArrowUp') { e.preventDefault(); setBpm(eng.bpm + (e.shiftKey ? 5 : 1)); }
      else if (k === 'ArrowDown') { e.preventDefault(); setBpm(eng.bpm - (e.shiftKey ? 5 : 1)); }
      else if (idx >= 0 && !e.shiftKey) {
        eng.unlock(); triggerPad(idx, 0.92, 'k' + k.toLowerCase());
      }
    });
    document.addEventListener('keyup', function (e) { eng.release('k' + e.key.toLowerCase()); });
    window.addEventListener('blur', function () { eng.repeaters.clear(); });

    // drag & drop audio anywhere
    document.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
      var f = e.dataTransfer.files[0];
      if (/\.dust$|\.json$/i.test(f.name)) { f.text().then(function (t) { applyProject(JSON.parse(t)); toast('Imported project'); markDirty(); }).catch(function (er) { toast(er.message || 'Invalid file'); }); }
      else loadChopFile(f);
    });

    window.addEventListener('beforeunload', function () { dirty = true; saveAutosave(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { saveAutosave(); releaseWake(); } else if (eng.seq.playing) requestWake();
    });
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; refs.install.hidden = false; });
    window.addEventListener('appinstalled', function () { refs.install.hidden = true; deferredInstall = null; toast('Installed — find DUSTCUTTER on your home screen'); });
    saveTimer = setInterval(saveAutosave, 4000);
  }

  function doInstall() {
    if (!deferredInstall) return;
    deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; refs.install.hidden = true; });
  }

  function registerSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    var hadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('A new version is ready', { label: 'RELOAD', fn: function () { nw.postMessage('SKIP_WAITING'); } });
          });
        });
      }).catch(function () { /* offline install unavailable */ });
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return; // first install claims the page silently
        if (!ui.started) { reloading = true; location.reload(); }
        else toast('Updated to the latest version', { label: 'RELOAD', fn: function () { location.reload(); } });
      });
    });
  }

  function boot() {
    buildShell();
    wireGlobal();
    registerSW();
    renderKits(); syncTransport();
    var q = new URLSearchParams(location.search), tab = q.get('tab');
    if (tab && TABS.some(function (t) { return t[0] === tab; })) ui.tab = tab;
    eng.init(function (n, total) {
      refs.splashMsg.textContent = 'Building kits… ' + n + '/' + total;
      refs.splashBar.firstChild.style.width = (n / total * 100) + '%';
    }).then(function () {
      return DB.get('autosave', 'current').catch(function () { return null; });
    }).then(function (saved) {
      renderPads(); showTab(ui.tab);
      if (saved) {
        try {
          applyProject(saved); showTab(ui.tab);
          toast('Last session restored', { label: 'START FRESH', fn: function () { newProject(); markDirty(); } });
        } catch (e) { /* corrupt autosave – start clean */ loadPattern(0); }
      } else loadPattern(0);
      refs.splashMsg.textContent = 'Ready'; refs.startBtn.textContent = 'TAP TO START'; refs.startBtn.disabled = false;
      requestAnimationFrame(frame);
    }).catch(function (e) {
      refs.splashMsg.textContent = (e && e.message) || 'Audio could not start.'; refs.startBtn.textContent = 'UNSUPPORTED';
    });
  }

  window.DC = { eng: eng, ui: ui, triggerPad: triggerPad, chooseLoop: chooseLoop, applyProject: applyProject, snapshot: snapshot, version: VERSION };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
