<script>
/*!
 * DUSTCUTTER M-1 PRO — DSP voice library
 * Pure, dependency-free sample synthesis (works in the browser and in Node).
 * Every voice returns a mono Float32Array at the requested sample rate.
 * (c) Luca Marino Productions
 */
(function (root) {
  'use strict';

  var TAU = Math.PI * 2;

  /* ---------- helpers ---------- */

  /** Small deterministic PRNG so every kit sounds identical on every device. */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** RBJ biquad. Returns a per-sample processor function. */
  function biquad(type, f, q, sr) {
    var w = TAU * Math.min(f, sr * 0.45) / sr;
    var c = Math.cos(w), s = Math.sin(w), al = s / (2 * q);
    var b0, b1, b2;
    if (type === 'lp') { b0 = (1 - c) / 2; b1 = 1 - c; b2 = b0; }
    else if (type === 'hp') { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = b0; }
    else { b0 = al; b1 = 0; b2 = -al; } // bandpass (constant 0 dB peak gain)
    var a0 = 1 + al, a1 = -2 * c, a2 = 1 - al;
    b0 /= a0; b1 /= a0; b2 /= a0; a1 /= a0; a2 /= a0;
    var x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    return function (x) {
      var y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = x; y2 = y1; y1 = y;
      return y;
    };
  }

  /** Chamberlin state-variable filter (bandpass out) – safe for fast sweeps. */
  function svfBand() {
    var low = 0, band = 0;
    return function (x, fc, q, sr) {
      var f = 2 * Math.sin(Math.PI * Math.min(fc, sr / 6) / sr);
      low += f * band;
      var high = x - low - q * band;
      band += f * high;
      return band;
    };
  }

  function build(sr, len, fn) {
    var n = Math.max(1, Math.floor(sr * len));
    var out = new Float32Array(n);
    for (var i = 0; i < n; i++) out[i] = fn(i / sr, i);
    return out;
  }

  /** Remove DC, normalise to `peak`, short fade-out so nothing ever clicks. */
  function finish(buf, sr, peak, fade) {
    peak = peak || 0.92; fade = fade == null ? 0.006 : fade;
    var n = buf.length, i, mean = 0;
    for (i = 0; i < n; i++) mean += buf[i];
    mean /= n;
    if (Math.abs(mean) > 1e-4) for (i = 0; i < n; i++) buf[i] -= mean;
    var pk = 0;
    for (i = 0; i < n; i++) { var a = Math.abs(buf[i]); if (a > pk) pk = a; }
    var g = pk > 1e-9 ? peak / pk : 1;
    for (i = 0; i < n; i++) buf[i] *= g;
    var f = Math.min(n, Math.floor(fade * sr));
    for (i = 0; i < f; i++) buf[n - 1 - i] *= i / f;
    return buf;
  }

  function reverse(buf) {
    var out = new Float32Array(buf.length);
    for (var i = 0, n = buf.length; i < n; i++) out[i] = buf[n - 1 - i];
    return out;
  }

  function sat(x, k) { return Math.tanh(x * k) / Math.tanh(k); }
  function saw(ph) { return 2 * (ph - Math.floor(ph)) - 1; }
  function sq(ph) { return (ph - Math.floor(ph)) < 0.5 ? 1 : -1; }

  /** Sine kick with exponential pitch sweep, optional click and drive. */
  function kick(sr, o) {

    return finish(build(sr, o.len, function (t) {
      var f = o.f1 + (o.f0 - o.f1) * Math.exp(-t * o.sweep);

      var s = Math.sin(ph) * Math.exp(-t / o.dec);
      if (o.click) s += hp(r() * 2 - 1) * Math.exp(-t * 420) * o.click;
      if (o.drive) s = sat(s, o.drive);
      return s;

  /** Two-oscillator body + band-limited noise snare. */
  function snare(sr, o) {
    var r = rng(o.seed || 2), bp = biquad('bp', o.nf || 5000, o.nq || 0.7, sr),
      hp = biquad('hp', o.nhp || 1500, 0.7, sr), p1 = 0, p2 = 0;
    return finish(build(sr, o.len || 0.4, function (t) {
      p1 += TAU * o.f1 * (1 + (o.bend || 0) * Math.exp(-t * 60)) / sr;
      p2 += TAU * o.f2 / sr;
      var body = (Math.sin(p1) * 0.75 + Math.sin(p2) * 0.4) * Math.exp(-t / o.db);
      var nz = hp(bp(r() * 2 - 1)) * Math.exp(-t / o.dn) * o.nmix;
      return Math.tanh((body * o.bmix + nz) * (o.drive || 1));
    }), sr);
  }

  var HATF = [205.3, 304.4, 369.6, 522.7, 540, 800]; // classic six-square metallic cluster

  /** Metallic hat / cymbal: 6 square oscillators + noise, band-passed. */
  function hat(sr, o) {
    var ph = [0, 0, 0, 0, 0, 0], r = rng(o.seed || 3),
      hp = biquad('hp', o.hp || 7000, 0.9, sr), bp = biquad('bp', o.bp || 10000, 0.9, sr),
      att = o.attack || 0.0008;
    return finish(build(sr, o.len, function (t) {
      var s = 0, i;
      for (i = 0; i < 6; i++) { ph[i] += HATF[i] * o.pitch / sr; s += ph[i] % 1 < 0.5 ? 1 : -1; }
      s = (s / 6) * (1 - o.noise) + (r() * 2 - 1) * o.noise;
      s = bp(hp(s)) * 2;
      return s * Math.exp(-t / o.dec) * (t < att ? t / att : 1);
    }), sr, 0.9);

  /** Multi-burst hand clap with a decaying tail. */
  function clap(sr, o) {
    var r = rng(o.seed || 4), bp = biquad('bp', o.f || 1200, 1.4, sr), hp = biquad('hp', 500, 0.7, sr);
    var gaps = o.gaps || [0, 0.009, 0.018, 0.027], last = gaps[gaps.length - 1];
    return finish(build(sr, o.len || 0.4, function (t) {
      var e = 0, i;
      for (i = 0; i < gaps.length; i++) {
        if (t >= gaps[i] && t < gaps[i] + 0.03) e = Math.max(e, Math.exp(-(t - gaps[i]) / 0.006));

      if (t > last) e = Math.max(e, Math.exp(-(t - last) / o.tail) * 0.85);
      return Math.tanh(bp(hp(r() * 2 - 1)) * e * 4);
    }), sr);

  function rim(sr, o) {
    var a = 0, b = 0, r = rng(5), hp = biquad('hp', 3000, 0.7, sr);
    return finish(build(sr, 0.14, function (t) {
      a += TAU * o.f1 / sr; b += TAU * o.f2 / sr;

    var ph = 0, r = rng(o.seed || 6);
    return finish(build(sr, o.len || 0.5, function (t) {
      var f = o.f * (1 + o.bend * Math.exp(-t * o.sweep));
      ph += TAU * f / sr;
      return Math.sin(ph) * Math.exp(-t / o.dec) + (r() * 2 - 1) * Math.exp(-t / 0.004) * (o.click == null ? 0.12 : o.click);

    var p1 = 0, p2 = 0, bp = biquad('bp', o.bp || 2600, 1.1, sr);
    return finish(build(sr, o.len || 0.55, function (t) {
      p1 += o.f1 / sr; p2 += o.f2 / sr;
      var s = bp((sq(p1) + sq(p2)) * 0.5);
      return s * (Math.exp(-t / 0.014) * 0.65 + Math.exp(-t / o.dec) * 0.35) * 3;
    }), sr);
  }

  function clave(sr, o) {
    var ph = 0, r = rng(7);
    return finish(build(sr, 0.12, function (t) {
      ph += TAU * o.f / sr;
      return Math.sin(ph) * Math.exp(-t / 0.018) + (r() * 2 - 1) * Math.exp(-t / 0.0015) * 0.2;
    }), sr);
  }

  function shaker(sr, o) {
    var r = rng(o.seed || 8), bp = biquad('bp', o.f || 6500, 0.9, sr);
    return finish(build(sr, o.len || 0.22, function (t) {
      var e = Math.min(1, t / o.att) * Math.exp(-Math.max(0, t - o.att) / o.dec);
      return bp(r() * 2 - 1) * e * 3;
    }), sr);
  }

  function tambourine(sr) {
    var r = rng(9), hp = biquad('hp', 5000, 0.8, sr), ph = [0, 0, 0], fr = [7200, 8500, 9700];
    return finish(build(sr, 0.35, function (t) {
      var m = 0, i;
      for (i = 0; i < 3; i++) { ph[i] += TAU * fr[i] / sr; m += Math.sin(ph[i]); }
      var e = Math.exp(-t / 0.09) * (t < 0.001 ? t / 0.001 : 1);
      return hp(r() * 2 - 1) * e + m * 0.18 * Math.exp(-t / 0.05);
    }), sr);
  }

  function guiro(sr) {
    var r = rng(10), bp = biquad('bp', 3200, 1.5, sr);
    return finish(build(sr, 0.32, function (t) {
      var e = 0, i;
      for (i = 0; i < 11; i++) { var s = i * 0.022; if (t >= s) e = Math.max(e, Math.exp(-(t - s) / 0.012) * (1 - i * 0.05)); }

  }

  function snap(sr) {
    var r = rng(11), bp = biquad('bp', 2400, 3, sr);
    return finish(build(sr, 0.16, function (t) {
      return bp(r() * 2 - 1) * Math.exp(-t / 0.018) * 3 + Math.sin(TAU * 1800 * t) * Math.exp(-t / 0.004) * 0.3;

    var pc = 0, pm = 0;
    return finish(build(sr, o.len || 0.2, function (t) {

  function cymbal(sr, o) { return hat(sr, o); }

  function ride(sr, o) {
    var base = hat(sr, { len: o.len, dec: o.dec, pitch: o.pitch, noise: 0.15, hp: 5500, bp: 9000, seed: 21, attack: 0.0006 });
    var ph = 0;
    for (var i = 0; i < base.length; i++) {

    var n = freqs.length, ph1 = [], ph2 = [], i, z1 = 0, z2 = 0;
    for (i = 0; i < n; i++) { ph1.push(0); ph2.push(i * 0.13); }
    return finish(build(sr, o.len || 1.1, function (t) {
      var s = 0;
      for (var k = 0; k < n; k++) {

  function rhodes(sr, f) {
    var pc = 0, pm = 0, pb = 0;
    return finish(build(sr, 1.4, function (t) {
      pm += TAU * f * 14 / sr; pb += TAU * f / sr;
      pc += TAU * f / sr;
      var mod = Math.sin(pm) * 0.6 * Math.exp(-t / 0.03) + Math.sin(pb) * 1.1 * Math.exp(-t / 0.35);
      return Math.sin(pc + mod) * Math.exp(-t / 0.55) * Math.min(1, t / 0.002);
    }), sr, 0.9);
  }

  function sub(sr, o) {
    var ph = 0;
    return finish(build(sr, o.len || 1.0, function (t) {
      var f = o.f * (1 + (o.slide || 0) * Math.exp(-t * 6));

      var s = Math.sin(ph) + 0.28 * Math.sin(ph * 2) + 0.1 * Math.sin(ph * 3);
      return sat(s * 0.9, 1.8) * Math.exp(-t / (o.dec || 0.5)) * Math.min(1, t / 0.003);

    for (i = 0; i < out.length; i++) {

      d[idx] = (cur + nxt) * 0.4985;
      out[i] = cur; idx = (idx + 1) % N;

    var n = freqs.length, ph = [], z = 0, i;
    for (i = 0; i < n * 3; i++) ph.push(i * 0.21);
    return finish(build(sr, 1.8, function (t) {
      var s = 0, k, j;
      for (k = 0; k < n; k++) for (j = 0; j < 3; j++) {

  }

  function voxSweep(sr) {
    var r = rng(41), f = svfBand();
    return finish(build(sr, 1.3, function (t) {
      var fc = 380 + 2100 * Math.pow(t / 1.3, 1.4);
      var e = Math.sin(Math.PI * Math.min(1, t / 1.3));
      return f(r() * 2 - 1, fc, 0.12, sr) * e;
    }), sr, 0.85);
  }

  function doInstall() {
    if (!deferredInstall) return;
    deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; refs.install.hidden = true; });
  }

  function registerSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    var hadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('A new version is ready', { label: 'RELOAD', fn: function () { nw.postMessage('SKIP_WAITING'); } });
          });
        });
      }).catch(function () { /* offline install unavailable */ });
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading || !hadController) return; // first install claims the page silently
        if (!ui.started) { reloading = true; location.reload(); }
        else toast('Updated to the latest version', { label: 'RELOAD', fn: function () { location.reload(); } });
      });
    });
  }

  function boot() {
    buildShell();
    wireGlobal();
    registerSW();
    renderKits(); syncTransport();
    var q = new URLSearchParams(location.search), tab = q.get('tab');
    if (tab && TABS.some(function (t) { return t[0] === tab; })) ui.tab = tab;
    eng.init(function (n, total) {
      refs.splashMsg.textContent = 'Building kits… ' + n + '/' + total;
      refs.splashBar.firstChild.style.width = (n / total * 100) + '%';
    }).then(function () {
      return DB.get('autosave', 'current').catch(function () { return null; });
    }).then(function (saved) {
      renderPads(); showTab(ui.tab);
      if (saved) {
        try {
          applyProject(saved); showTab(ui.tab);
          toast('Last session restored', { label: 'START FRESH', fn: function () { newProject(); markDirty(); } });
        } catch (e) { /* corrupt autosave – start clean */ loadPattern(0); }
      } else loadPattern(0);
      refs.splashMsg.textContent = 'Ready'; refs.startBtn.textContent = 'TAP TO START'; refs.startBtn.disabled = false;
      requestAnimationFrame(frame);
    }).catch(function (e) {
      refs.splashMsg.textContent = (e && e.message) || 'Audio could not start.'; refs.startBtn.textContent = 'UNSUPPORTED';
    });
  }

  window.DC = { eng: eng, ui: ui, triggerPad: triggerPad, chooseLoop: chooseLoop, applyProject: applyProject, snapshot: snapshot, version: VERSION };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
